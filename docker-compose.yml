version: '3.8'

# Development compose for local development.
# Production deploy should use a separate file named docker-compose.prod.yml on the server.
# For day-to-day dev, prefer: npm run dev:api && npm run dev:web

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    container_name: wedding_api_dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wedding:wedding@host.docker.internal:5432/wedding
      APP_PORT: 3001
      JWT_SECRET: dev-jwt-secret-change-in-production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages/prisma:/app/packages/prisma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: npm run start:dev --workspace=apps/api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: builder
    container_name: wedding_web_dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src
    depends_on:
      - api
    command: npm run dev
